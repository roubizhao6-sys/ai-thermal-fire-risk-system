name: ThermalGuard
options:
  bundleIdPrefix: com.thermalguard
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  ThermalGuardUser:
    type: application
    platform: iOS
    sources:
      - path: Sources/Core
      - path: Sources/User
    info:
      path: Info/User.plist
      properties:
        CFBundleDisplayName: 逃生指引
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: 用于读取手机朝向，把撤离方向对准真实世界。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thermalguard.user
        PRODUCT_NAME: ThermalGuardUser
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
  ThermalGuardSystem:
    type: application
    platform: iOS
    sources:
      - path: Sources/Core
      - path: Sources/System
    info:
      path: Info/System.plist
      properties:
        CFBundleDisplayName: 热感哨兵
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: 用于在城市热力地图上定位火警点位。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thermalguard.system
        PRODUCT_NAME: ThermalGuardSystem
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
