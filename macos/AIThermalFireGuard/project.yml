name: AIThermalFireGuard
options:
  bundleIdPrefix: com.thermalguard
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  AIThermalFireGuard:
    type: application
    platform: macOS
    sources:
      - path: Sources/AIThermalFireGuard
    resources:
      - path: AppStore/Resources
    info:
      path: AppStore/Info.plist
      properties:
        CFBundleDisplayName: AI热感火警风险检测
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSLocalNetworkUsageDescription: 用于连接同一局域网内的 ESP32 热成像设备。
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: Copyright © 2026. All rights reserved.
    entitlements:
      path: AppStore/AIThermalFireGuard.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thermalguard.AIThermalFireGuard
        PRODUCT_NAME: AIThermalFireGuard
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
